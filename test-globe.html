<!doctype html>
<html>
<head>
  <style>body { margin: 0; background: #000; }</style>
</head>
<body>
  <div id="globe" style="width: 100vw; height: 100vh;"></div>
  <script type="importmap">{"imports": {"globe.gl": "https://esm.sh/globe.gl"}}</script>
  <script type="module">
    import Globe from 'globe.gl';
    
    const arcsData = [
      { startLat: 39.47, startLng: -0.38, endLat: 37.77, endLng: -122.42, color: 'cyan' },
      { startLat: 39.47, startLng: -0.38, endLat: 51.51, endLng: -0.13, color: 'orange' },
      { startLat: 39.47, startLng: -0.38, endLat: 35.68, endLng: 139.65, color: 'purple' },
      { startLat: 39.47, startLng: -0.38, endLat: -33.87, endLng: 151.21, color: 'lime' },
    ];

    const globe = Globe()
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      .showAtmosphere(true)
      .atmosphereColor('#4fc3f7')
      .arcColor('color')
      .arcDashLength(0.5)
      .arcDashGap(0.2)
      .arcDashAnimateTime(1500)
      .arcStroke(0.5)
      .arcsData(arcsData)
      .pointsData([
        { lat: 39.47, lng: -0.38, color: 'white', size: 0.5 },
        { lat: 37.77, lng: -122.42, color: 'cyan', size: 0.3 },
      ])
      .pointColor('color')
      .pointRadius('size')
      .pointAltitude(0.01)
      (document.getElementById('globe'));
    
    globe.pointOfView({ lat: 39.47, lng: -0.38, altitude: 2.5 });
  </script>
</body>
</html>
