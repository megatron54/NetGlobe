[package]
name = "netglobe"
version = "0.1.0"
description = "Real-time 3D network traffic visualization globe"
authors = ["Miguel Serra Ferrando"]
edition = "2021"

[lib]
name = "netglobe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
pcap = { version = "2", features = [] }
maxminddb = "0.24"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
pnet = "0.35"
